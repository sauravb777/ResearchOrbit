[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "researchpilot"
version = "93.0.0"
description = "Evidence-grounded research assistant agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "streamlit>=1.35",
    "pywin32>=306; sys_platform == 'win32'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langgraph>=1.2.12,<1.3",
    "langchain-core>=1.6.5,<1.7",
    "langchain>=1.4.2,<1.5",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.23"]
semantic = ["sentence-transformers>=3.0", "numpy>=1.24"]
[project.scripts]
researchpilot = "researchpilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
