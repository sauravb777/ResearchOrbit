services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RESEARCHPILOT_JOB_DB: /app/data/jobs.db
      RESEARCHPILOT_CORS_ORIGINS: ${RESEARCHPILOT_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - researchpilot_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  researchpilot_data:
